<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal Petugas Haji</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#166534;--primary2:#15803d;--border:#d9e1ea;--green:#16a34a;--yellow:#f59e0b;--red:#dc2626}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,#14532d,#166534);color:white;padding:22px 18px;position:sticky;top:0;z-index:10;box-shadow:0 3px 15px #0002}
.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}.title{font-size:21px;font-weight:800}.subtitle{font-size:13px;opacity:.85;margin-top:3px}
.timer{font-size:20px;font-weight:800;background:#fff2;padding:10px 14px;border-radius:12px;min-width:88px;text-align:center}
.container{max-width:1100px;margin:20px auto;padding:0 14px}.layout{display:grid;grid-template-columns:1fr 300px;gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 5px 20px #1018280b}
.question-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.qnum{font-size:14px;font-weight:800;color:var(--primary)}
.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#eef2f6;color:#475467}.badge.mark{background:#fff7e6;color:#a15c00}
.question{font-size:20px;line-height:1.55;font-weight:700;margin:20px 0}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--border);padding:14px 15px;border-radius:13px;margin:10px 0;cursor:pointer;font-size:15px;line-height:1.45;transition:.15s}
.option:hover{border-color:#86b79a;background:#f7fbf8}.option.selected{border-color:var(--primary2);background:#f0fdf4}.letter{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef2f6;font-weight:800}.selected .letter{background:var(--primary2);color:white}
.nav-title{font-weight:800;margin-bottom:12px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}.dot{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:-2px}.dgreen{background:var(--green)}.dyellow{background:var(--yellow)}.dgray{background:#e5e7eb}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{border:0;background:#eef2f6;border-radius:7px;padding:8px 0;font-weight:700;cursor:pointer}.num.current{outline:2px solid var(--primary2);outline-offset:1px}.num.answered{background:var(--green);color:white}.num.marked{background:var(--yellow);color:white}.num.answered.marked{background:linear-gradient(135deg,var(--green) 0 50%,var(--yellow) 50%);color:white}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer}.prev,.next{background:#e9eef3;color:#344054}.next{background:var(--primary);color:white}.markbtn{background:#fff7e6;color:#9a5b00;border:1px solid #f3c76b}.finish{background:#b91c1c;color:white;width:100%;margin-top:12px}
.progress{height:8px;background:#e9eef3;border-radius:99px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:var(--green);transition:.2s}
.start{max-width:700px;margin:55px auto}.start h1{font-size:30px;margin-bottom:8px}.start p{color:var(--muted);line-height:1.6}.start .big{width:100%;padding:15px;background:var(--primary);color:white;border:0;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
.result{text-align:center}.score{font-size:64px;font-weight:900;color:var(--primary);margin:10px}.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.review{margin-top:20px;text-align:left}.review-item{padding:15px;border:1px solid var(--border);border-radius:12px;margin:9px 0}.correct{color:var(--green);font-weight:800}.wrong{color:var(--red);font-weight:800}
.note{margin-top:16px;padding:13px 15px;background:#f8fafc;border-left:4px solid #94a3b8;border-radius:8px;color:#475467;line-height:1.5;font-size:14px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.nav-card{order:-1}.grid{grid-template-columns:repeat(10,1fr)}.question{font-size:18px}.header-inner{align-items:flex-start}.timer{font-size:17px;min-width:78px}}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}.modal-card{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0005;text-align:center}
.qr-img{width:min(100%,420px);height:auto;border-radius:12px;border:1px solid #e5e7eb}
.modal-title{font-size:23px;font-weight:900;color:#8a5a00;margin-bottom:5px}
.modal-price{font-size:28px;font-weight:900;color:#166534;margin:8px 0 14px}
.modal-text{font-size:14px;line-height:1.6;color:#475467}
.code-input{width:100%;padding:13px;border:2px solid #d9e1ea;border-radius:10px;font-size:16px;margin:10px 0}
.wa-btn{display:block;width:100%;padding:13px 16px;border:0;border-radius:11px;background:#16a34a;color:#fff;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;text-align:center;margin-top:10px}
.wa-btn:hover{filter:brightness(.95)}

.premium-box{background:linear-gradient(135deg,#fff8e7,#fff);border:1px solid #f2cf76;border-radius:15px;padding:17px;margin-top:18px;text-align:left}
.premium-title{font-weight:900;color:#8a5a00;font-size:18px}.premium-list{color:#475467;line-height:1.7;font-size:14px}.lock{color:#a15c00;font-weight:800}.plan{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.plan button{flex:1;min-width:180px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BANK = [{"id": 1, "question": "Setelah selesai melaksanakan seluruh prosesi ibadah haji, sebelum melakukan perjalanan pulang, sebaiknya jamaah haji melakukan apa?", "options": [{"text": "Beristirahat", "correct": true}, {"text": "Berbelanja oleh-oleh", "correct": false}, {"text": "Langsung melakukan perjalanan pulang", "correct": false}, {"text": "Melakukan aktivitas fisik yang berat", "correct": false}], "answer": "A", "note": ""}, {"id": 2, "question": "Pemberian manasik kesehatan haji merupakan proses untuk mengubah perilaku jemaah haji dalam meningkatkan status kesehatannya. Bagaimana strategi yang tepat dalam pemberian manasik kesehatan haji?", "options": [{"text": "Terstruktur, strategis, dan masif", "correct": true}, {"text": "Cepat, sederhana, dan terbatas", "correct": false}, {"text": "Fleksibel, spontan, dan individual", "correct": false}, {"text": "Terpusat, formal, dan berkala", "correct": false}], "answer": "A", "note": ""}, {"id": 3, "question": "Manasik kesehatan haji harus diselenggarakan secara terstruktur, sistematis, dan masif. Apakah yang dimaksud dengan kata “terstruktur” dalam penyelenggaraan manasik kesehatan haji?", "options": [{"text": "Dilaksanakan dari tingkat pusat, provinsi, kabupaten/kota hingga puskesmas sesuai dengan kewenangannya", "correct": true}, {"text": "Dilaksanakan secara bertahap sesuai dengan jadwal dan materi manasik yang telah ditetapkan", "correct": false}, {"text": "Dilaksanakan secara luas dan berkelanjutan agar informasi kesehatan menjangkau seluruh jemaah haji", "correct": false}, {"text": "Dilaksanakan berdasarkan kondisi kesehatan, kebutuhan, dan karakteristik masing-masing jemaah haji", "correct": false}], "answer": "A", "note": ""}, {"id": 4, "question": "Manasik kesehatan haji diberikan secara berkelanjutan sejak jemaah mendaftar hingga setelah melaksanakan ibadah haji. Bagaimanakah tahapan manasik kesehatan haji yang tepat?", "options": [{"text": "Masa tunggu – masa keberangkatan – masa embarkasi – masa operasional haji – masa debarkasi haji", "correct": true}, {"text": "Masa pendaftaran – masa pemeriksaan kesehatan – masa embarkasi – masa operasional haji – masa kepulangan", "correct": false}, {"text": "Masa tunggu – masa persiapan – masa keberangkatan – masa operasional haji – masa pemulangan", "correct": false}, {"text": "Masa pendaftaran – masa tunggu – masa embarkasi – masa operasional haji – masa debarkasi haji", "correct": false}], "answer": "A", "note": ""}, {"id": 5, "question": "Manasik kesehatan haji menerapkan strategi koordinasi, kolaborasi, dan integrasi yang melibatkan berbagai pihak. Bagaimanakah prinsip pemberian informasi dalam manasik kesehatan haji yang tepat?", "options": [{"text": "Informasi harus terstandar dan konsisten sehingga aman serta tidak bertentangan satu sama lain", "correct": true}, {"text": "Informasi disesuaikan sepenuhnya dengan kebijakan masing-masing pelaksana agar lebih fleksibel", "correct": false}, {"text": "Informasi dapat diberikan berdasarkan pengalaman masing-masing petugas selama tidak menimbulkan kebingungan", "correct": false}, {"text": "Informasi diberikan secara berbeda sesuai dengan kebutuhan setiap organisasi yang terlibat dalam pelaksanaan manasik", "correct": false}], "answer": "A", "note": ""}, {"id": 6, "question": "Penetapan kriteria istithaah kesehatan haji melibatkan berbagai pihak dalam tim penyelenggara kesehatan haji. Apa saja yang harus dilaksanakan pada pemeriksaan kesehatan masa keberangkatan?", "options": [{"text": "Anamnesis, pemeriksaan fisik (PF), pemeriksaan penunjang (PP), hasil dan rekomendasi dokter spesialis, diagnosis, penetapan istithaah kesehatan, serta rekomendasi/saran/rencana tindak lanjut (RTL)", "correct": true}, {"text": "Anamnesis, pemeriksaan fisik, pemberian obat, pemeriksaan vaksinasi, diagnosis, dan penetapan jadwal keberangkatan", "correct": false}, {"text": "Pemeriksaan penunjang, konsultasi dokter spesialis, pemberian terapi, observasi kesehatan, penetapan istithaah, dan pemulangan jemaah", "correct": false}, {"text": "Anamnesis, pemeriksaan fisik, pemeriksaan penunjang, diagnosis, pemberian obat, dan pemeriksaan kesehatan setelah kepulangan", "correct": false}], "answer": "A", "note": ""}, {"id": 7, "question": "Jemaah haji akan menempuh perjalanan jauh menuju Arab Saudi dengan menggunakan pesawat. Kondisi selama penerbangan, seperti posisi duduk dalam waktu lama, penggunaan AC, serta keterbatasan dan ketidakbiasaan menggunakan fasilitas toilet, dapat menyebabkan jemaah membatasi konsumsi minum. Apa dampak yang dapat terjadi akibat kebiasaan tersebut?", "options": [{"text": "Dehidrasi", "correct": true}, {"text": "Hipotermia", "correct": false}, {"text": "Hipertensi", "correct": false}, {"text": "Hipoglikemia", "correct": false}], "answer": "A", "note": ""}, {"id": 8, "question": "Dalam perjalanan menuju Arab Saudi, jemaah haji dapat mengalami gangguan kesehatan berupa DVT (Deep Vein Thrombosis), yaitu terbentuknya bekuan darah pada vena dalam, terutama di tungkai. Kondisi tersebut dapat terjadi akibat...", "options": [{"text": "Terlalu lama tidak bergerak", "correct": true}, {"text": "Terlalu sering melakukan aktivitas fisik", "correct": false}, {"text": "Terlalu banyak mengonsumsi makanan berserat", "correct": false}, {"text": "Terlalu sering mengubah posisi duduk", "correct": false}], "answer": "A", "note": ""}, {"id": 9, "question": "Jemaah haji dapat mengalami jet lag akibat perubahan zona waktu selama penerbangan menuju Arab Saudi. Salah satu cara yang dapat dilakukan untuk membantu mengatasi jet lag adalah...", "options": [{"text": "Mengusahakan tetap terjaga satu jam sebelum mendarat", "correct": true}, {"text": "Tidur sepanjang penerbangan agar tubuh tidak kelelahan", "correct": false}, {"text": "Menghindari paparan cahaya setelah pesawat mendarat", "correct": false}, {"text": "Mengonsumsi makanan dalam jumlah banyak sebelum mendarat", "correct": false}], "answer": "A", "note": ""}, {"id": 10, "question": "Untuk mencegah dehidrasi selama menjalankan ibadah haji, jemaah dianjurkan untuk memenuhi kebutuhan cairan secara teratur. Berapakah anjuran minum air putih yang tepat?", "options": [{"text": "1 gelas setiap jam", "correct": true}, {"text": "1 gelas setiap 2 jam", "correct": false}, {"text": "2 gelas setiap 3 jam", "correct": false}, {"text": "1 gelas setiap 4 jam", "correct": false}], "answer": "A", "note": ""}, {"id": 11, "question": "Pada saat take-off dan landing, jemaah haji dapat mengalami nyeri atau rasa tidak nyaman pada telinga akibat perubahan tekanan udara. Kondisi ini dapat diatasi dengan cara...", "options": [{"text": "Melakukan gerakan menelan, mengunyah, atau menguap", "correct": true}, {"text": "Menutup telinga dengan rapat dan menahan napas", "correct": false}, {"text": "Tidur dengan posisi kepala menunduk selama penerbangan", "correct": false}, {"text": "Menghindari membuka mulut selama pesawat naik dan turun", "correct": false}], "answer": "A", "note": ""}, {"id": 12, "question": "Jemaah haji berisiko mengalami dehidrasi selama penerbangan karena rendahnya kelembapan udara di dalam kabin pesawat. Apa saja yang dapat dilakukan untuk membantu mencegah dehidrasi selama berada di dalam pesawat?", "options": [{"text": "Minum air putih minimal 200 ml (1 gelas) setiap jam, menggunakan selimut, dan memakai kaos kaki", "correct": true}, {"text": "Minum air putih hanya ketika merasa haus, melepas selimut, dan tidak menggunakan kaos kaki", "correct": false}, {"text": "Mengurangi minum agar tidak sering menggunakan toilet, menggunakan selimut, dan melepas kaos kaki", "correct": false}, {"text": "Minum minuman manis setiap jam, menggunakan selimut, dan melakukan aktivitas fisik berat", "correct": false}], "answer": "A", "note": ""}, {"id": 13, "question": "Mabuk udara dapat terjadi ketika informasi yang diterima mata dan sistem vestibular di telinga bagian dalam tidak selaras sehingga menimbulkan gangguan pada tubuh. Tindakan yang dapat dilakukan untuk membantu mencegah mabuk udara adalah...", "options": [{"text": "Minum obat antimabuk, melonggarkan sabuk pengaman, serta menggosok perut dan anggota tubuh dengan minyak angin", "correct": true}, {"text": "Minum banyak minuman bersoda, mengencangkan sabuk pengaman, dan membaca selama penerbangan", "correct": false}, {"text": "Mengonsumsi makanan dalam jumlah banyak, menundukkan kepala, dan mengurangi pergerakan tubuh", "correct": false}, {"text": "Menutup mata terus-menerus, menahan napas, dan minum kopi untuk menjaga tubuh tetap terjaga", "correct": false}], "answer": "A", "note": ""}, {"id": 14, "question": "Tawaf merupakan ibadah fisik yang dilakukan dengan berjalan mengelilingi Ka'bah sebanyak 7 putaran dan dilakukan di tengah kumpulan massa. Kondisi tersebut dapat meningkatkan risiko penularan penyakit. Tindakan yang dapat mengurangi risiko kesehatan saat melakukan tawaf adalah...", "options": [{"text": "Menggunakan masker selama tawaf untuk membantu mencegah penularan penyakit", "correct": true}, {"text": "Mengurangi konsumsi air agar tidak perlu sering berhenti untuk beristirahat", "correct": false}, {"text": "Berjalan lebih cepat agar segera keluar dari area yang dipenuhi jemaah", "correct": false}, {"text": "Membuka masker agar pernapasan lebih leluasa selama melakukan tawaf", "correct": false}], "answer": "A", "note": ""}, {"id": 15, "question": "Wukuf di Arafah merupakan salah satu rangkaian penting dalam ibadah haji yang dilakukan di dalam tenda maupun di lapangan terbuka. Kondisi cuaca yang panas atau dingin, kelembapan udara yang rendah, serta kepadatan jemaah dapat meningkatkan risiko gangguan kesehatan. Tindakan yang tepat untuk mengurangi risiko kesehatan selama wukuf di Arafah adalah...", "options": [{"text": "Beraktivitas di lapangan terbuka selama mungkin, mengurangi konsumsi makanan, dan minum hanya ketika merasa haus", "correct": false}, {"text": "Beristirahat hanya ketika merasa lelah, menghindari penggunaan masker, serta mengurangi konsumsi air", "correct": false}, {"text": "Menghindari paparan langsung udara panas/dingin, melaksanakan wukuf di dalam tenda, cukup beristirahat, menggunakan masker dan payung saat mengantre di toilet, makan tepat waktu, serta minum air putih minimal 1 gelas setiap jam", "correct": true}, {"text": "Menghindari paparan udara panas, memperbanyak aktivitas fisik, mengurangi waktu istirahat, dan membatasi minum", "correct": false}], "answer": "C", "note": ""}, {"id": 16, "question": "Jemaah haji mendapatkan paket alat pelindung diri (APD) yang dapat digunakan untuk melindungi diri dari berbagai risiko kesehatan selama melaksanakan ibadah haji. Manakah alat pelindung diri yang dapat digunakan untuk membantu mencegah sengatan panas (heat stroke)?", "options": [{"text": "Masker, sarung tangan, kacamata, dan penutup telinga", "correct": false}, {"text": "Jaket tebal, sarung tangan, masker, dan penutup kepala", "correct": false}, {"text": "Sepatu, sarung tangan, masker, dan kacamata pelindung", "correct": false}, {"text": "Payung, semprotan air, masker, dan alas kaki", "correct": true}], "answer": "D", "note": ""}, {"id": 17, "question": "Tawaf dilakukan dengan mengelilingi Ka'bah sebanyak 7 putaran dan dilaksanakan di tengah kumpulan massa. Untuk menjaga kondisi kesehatan selama tawaf, jemaah haji hendaknya memperhatikan hal-hal berikut, yaitu...", "options": [{"text": "Tetap melanjutkan tawaf meskipun merasa lelah agar ibadah dapat segera diselesaikan", "correct": false}, {"text": "Menghindari memaksakan diri saat merasa lelah dan beristirahat sejenak sekitar 2–3 menit sebelum melanjutkan putaran tawaf", "correct": true}, {"text": "Mengurangi konsumsi air sebelum tawaf agar tidak perlu berhenti selama melakukan putaran", "correct": false}, {"text": "Mempercepat langkah saat merasa lelah agar dapat segera menyelesaikan seluruh putaran tawaf", "correct": false}], "answer": "B", "note": ""}, {"id": 18, "question": "Jemaah haji yang sehat dianjurkan menyerahkan Kartu Kewaspadaan Kesehatan Jemaah Haji (K3JH) ke puskesmas terdekat dalam waktu 14 hari setelah kepulangan dari Arab Saudi. Kegiatan tersebut merupakan bagian dari tahapan manasik kesehatan haji yang disebut...", "options": [{"text": "Masa operasional haji", "correct": false}, {"text": "Masa debarkasi haji", "correct": false}, {"text": "Sehat saat tiba di rumah/kampung halaman", "correct": true}, {"text": "Masa keberangkatan jemaah haji", "correct": false}], "answer": "C", "note": ""}, {"id": 19, "question": "Setelah menempuh perjalanan jauh dan tiba di tanah air, jemaah haji diminta mengisi HAC atau K3JH saat kembali ke rumah masing-masing. Jika jemaah haji merasa sakit atau tidak sehat setelah kepulangan, tindakan yang sebaiknya dilakukan adalah...", "options": [{"text": "Beristirahat di rumah dan menunggu hingga kondisi membaik tanpa perlu melapor", "correct": false}, {"text": "Mengurangi aktivitas dan mengonsumsi obat sendiri sesuai perkiraan penyakit", "correct": false}, {"text": "Menghindari kontak dengan orang lain dan tetap melakukan aktivitas seperti biasa", "correct": false}, {"text": "Segera menghubungi petugas kesehatan untuk mendapatkan pemeriksaan dan penanganan", "correct": true}], "answer": "D", "note": ""}, {"id": 20, "question": "Selama menunggu masa kepulangan, jemaah haji tetap berada di hotel untuk beristirahat dan menjaga kondisi tubuh agar tetap prima sebelum kembali ke Indonesia. Arahan yang sebaiknya tetap dipatuhi oleh jemaah haji adalah...", "options": [{"text": "Mengurangi waktu istirahat, memperbanyak aktivitas, dan mengonsumsi makanan sesuai selera", "correct": false}, {"text": "Menerapkan perilaku hidup bersih dan sehat (PHBS), seperti menjaga kebersihan diri dan lingkungan, mengonsumsi makanan bergizi, serta beristirahat yang cukup", "correct": true}, {"text": "Membatasi konsumsi makanan dan minuman serta lebih banyak berada di dalam kamar", "correct": false}, {"text": "Memperbanyak aktivitas di luar hotel dan mengurangi waktu tidur agar tubuh tetap aktif", "correct": false}], "answer": "B", "note": ""}, {"id": 21, "question": "Salah satu upaya yang dapat dilakukan jemaah haji dalam mempersiapkan istithaah kesehatan sebelum keberangkatan adalah...", "options": [{"text": "Mengurangi aktivitas fisik agar tubuh tidak mudah lelah", "correct": false}, {"text": "Melakukan pemeriksaan kesehatan hanya menjelang keberangkatan", "correct": false}, {"text": "Mengikuti latihan fisik yang diselenggarakan oleh puskesmas", "correct": true}, {"text": "Memperbanyak istirahat dan menghindari olahraga selama masa persiapan", "correct": false}], "answer": "C", "note": ""}, {"id": 22, "question": "Perintah untuk melaksanakan ibadah haji dalam sejarah Islam dikaitkan dengan masa...", "options": [{"text": "Nabi Nuh a.s.", "correct": false}, {"text": "Nabi Musa a.s.", "correct": false}, {"text": "Nabi Isa a.s.", "correct": false}, {"text": "Nabi Ibrahim a.s.", "correct": true}], "answer": "D", "note": ""}, {"id": 23, "question": "Kalender Hijriah mulai ditetapkan berdasarkan peristiwa hijrah...", "options": [{"text": "Nabi Ibrahim a.s. dari Palestina ke Makkah", "correct": false}, {"text": "Nabi Muhammad ﷺ dari Makkah ke Madinah", "correct": true}, {"text": "Nabi Musa a.s. dari Mesir menuju Palestina", "correct": false}, {"text": "Nabi Isa a.s. dari Baitul Maqdis menuju tempat persembunyian", "correct": false}], "answer": "B", "note": ""}, {"id": 24, "question": "Jemaah haji melaksanakan ibadah haji dan umrah secara terpisah. Masing-masing ibadah dilakukan sendiri-sendiri pada waktu yang berbeda, tetapi masih dalam satu musim haji. Jenis haji yang dimaksud adalah...", "options": [{"text": "Haji Tamattu'", "correct": false}, {"text": "Haji Qiran", "correct": false}, {"text": "Haji Ifrad", "correct": true}, {"text": "Haji Badal", "correct": false}], "answer": "C", "note": ""}, {"id": 25, "question": "Tempat miqat haji dan umrah bagi jemaah haji yang datang dari Indonesia menurut fatwa MUI adalah...", "options": [{"text": "Bandara King Abdul Aziz dan Bir Ali", "correct":  "D", "note": "Catatan"}, {"id": 166, "question": "Pemeriksaan kesehatan jemaah haji pada masa embarkasi dilaksanakan oleh PPIH Embarkasi Bidang Kesehatan. Pemeriksaan tersebut bertujuan untuk menetapkan...", "options": [{"text": "Status istithaah kesehatan jemaah", "correct": false}, {"text": "Jenis pelayanan kesehatan selama di Arab Saudi", "correct": false}, {"text": "Status laik atau tidak laik terbang", "correct": true}, {"text": "Kelompok terbang jemaah haji", "correct": false}], "answer": "C", "note": "Catatan"}, {"id": 167, "question": "Jemaah haji yang ditetapkan memenuhi syarat istithaah kesehatan haji untuk sementara merupakan jemaah dengan kriteria...", "options": [{"text": "Memiliki penyakit kronis yang tidak terkontrol", "correct": false}, {"text": "Memerlukan perawatan intensif selama di Arab Saudi", "correct": false}, {"text": "Tidak mampu melakukan aktivitas ibadah tanpa bantuan", "correct": false}, {"text": "Tidak memiliki sertifikat vaksinasi internasional (ICV) yang sah", "correct": true}], "answer": "D", "note": "Catatan"}, {"id": 168, "question": "Penyelenggaraan kesehatan haji di Arab Saudi meliputi kegiatan...", "options": [{"text": "Pemeriksaan, pengobatan, dan rehabilitasi kesehatan", "correct": false}, {"text": "Promosi kesehatan, surveilans, dan pemeriksaan laboratorium", "correct": false}, {"text": "Pencegahan penyakit, pengobatan, dan pemulihan kesehatan", "correct": false}, {"text": "Pembinaan, pelayanan, dan perlindungan kesehatan", "correct": true}], "answer": "D", "note": "Catatan"}, {"id": 169, "question": "Menurut Permenkes Nomor 9 Tahun 2021, Kepala Kesehatan Daerah Kerja membawahi...", "options": [{"text": "KKHI, rumah sakit rujukan, dan puskesmas", "correct": false}, {"text": "Embarkasi, debarkasi, dan sektor", "correct": false}, {"text": "Klinik Kesehatan Haji, sektor, dan/atau pos kesehatan", "correct": true}, {"text": "Satgas Promotif Preventif, Satgas Kuratif, dan Satgas Obat", "correct": false}], "answer": "C", "note": "Catatan"}, {"id": 170, "question": "Pada saat operasional kesehatan haji, pelayanan kesehatan di daerah Mina menjadi tanggung jawab KKHI...", "options": [{"text": "Jeddah", "correct": false}, {"text": "Makkah", "correct": true}, {"text": "Madinah", "correct": false}, {"text": "Bandara", "correct": false}], "answer": "B", "note": "Catatan"}, {"id": 171, "question": "Menurut Permenkes Nomor 62 Tahun 2016, upaya kesehatan dalam bentuk tanggap cepat dan perlindungan spesifik untuk melindungi keselamatan jemaah haji pada seluruh tahapan penyelenggaraan ibadah haji merupakan pengertian dari...", "options": [{"text": "Pembinaan kesehatan", "correct": false}, {"text": "Pelayanan kesehatan", "correct": false}, {"text": "Pengendalian faktor risiko", "correct": false}, {"text": "Perlindungan kesehatan", "correct": true}], "answer": "D", "note": "Catatan"}, {"id": 172, "question": "Salah satu upaya penguatan pelayanan kesehatan pada fase Arafah, Muzdalifah, dan Mina (Armuzna) adalah...", "options": [{"text": "Memusatkan seluruh pelayanan kesehatan di KKHI Makkah", "correct": false}, {"text": "Menambah waktu pelayanan hanya di rumah sakit rujukan", "correct": false}, {"text": "Mengurangi pelayanan kesehatan karena jemaah berada dalam waktu singkat", "correct": false}, {"text": "Melakukan pelayanan kesehatan kegawatdaruratan secara gerak cepat di Arafah, Muzdalifah, dan Mina", "correct": true}], "answer": "D", "note": "Catatan:\nPelayanan kesehatan emergency gerak cepat diperlukan di Armuzna karena jemaah menghadapi aktivitas fisik tinggi, cuaca ekstrem, dan kepadatan jemaah."}, {"id": 173, "question": "Pemanfaatan teknologi dalam sistem komunikasi dan informasi antar-daerah kerja pada penyelenggaraan kesehatan haji bertujuan untuk...", "options": [{"text": "Mengurangi kebutuhan koordinasi antarpetugas", "correct": false}, {"text": "Memusatkan seluruh pelayanan kesehatan pada satu daerah kerja", "correct": false}, {"text": "Mempermudah penyimpanan data administrasi saja", "correct": false}, {"text": "Menjamin kelancaran koordinasi antar-daerah kerja terkait rujukan, mobilisasi petugas, distribusi obat dan perbekalan kesehatan, serta evakuasi tanazul", "correct": true}], "answer": "D", "note": "Catatan:\nTeknologi komunikasi dan informasi mendukung koordinasi secara cepat dan efektif, khususnya dalam rujukan, mobilisasi petugas, distribusi obat/perbekalan, dan evakuasi tanazul."}, {"id": 174, "question": "Manakah pernyataan yang tepat mengenai struktur Klinik Kesehatan Haji Indonesia (KKHI)?", "options": [{"text": "KKHI hanya terdiri atas Kepala KKHI dan petugas kloter", "correct": false}, {"text": "KKHI dipimpin oleh Kepala Daerah Kerja dan Koordinator TKH", "correct": false}, {"text": "KKHI hanya memiliki koordinator pelayanan medis dan farmasi", "correct": false}, {"text": "KKHI dipimpin oleh Kepala KKHI serta didukung Koordinator Pelayanan Medis, Koordinator Obat dan Perbekalan Kesehatan, serta Koordinator Penunjang Medik", "correct": true}], "answer": "D", "note": "Catatan:\nStruktur KKHI mencakup Kepala KKHI dan beberapa koordinator untuk mendukung pelayanan medis, pengelolaan obat dan perbekalan kesehatan, serta pelayanan penunjang medik."}, {"id": 175, "question": "Salah satu uraian tugas Kepala Satgas Promotif dan Preventif dalam penyelenggaraan kesehatan haji adalah...", "options": [{"text": "Melaksanakan pengadaan dan distribusi seluruh obat", "correct": false}, {"text": "Mengatur seluruh pelayanan rawat inap di KKHI", "correct": false}, {"text": "Melaksanakan pelayanan rujukan ke rumah sakit Arab Saudi", "correct": false}, {"text": "Melaksanakan upaya pencegahan melalui promosi kesehatan, perlindungan spesifik, deteksi dini, dan pengobatan yang tepat", "correct": true}], "answer": "D", "note": "Catatan:\nUpaya tersebut mencerminkan pendekatan promotif dan preventif, termasuk promosi kesehatan, perlindungan spesifik, deteksi dini, dan pengobatan yang tepat."}, {"id": 176, "question": "Komposisi Satuan Tugas Gerak Cepat (TGC) dalam penyelenggaraan kesehatan haji terdiri atas...", "options": [{"text": "Dokter, bidan, tenaga gizi, dan TPK", "correct": false}, {"text": "Perawat, sanitarian, tenaga laboratorium, dan TPK", "correct": false}, {"text": "Dokter, tenaga kefarmasian, tenaga gizi, dan TKH", "correct": false}, {"text": "Dokter, perawat, tenaga kefarmasian, dan TPK", "correct": true}], "answer": "D", "note": "Catatan:\nTGC terdiri atas dokter, perawat, tenaga kefarmasian, dan Tenaga Pendukung Kesehatan (TPK) untuk mendukung respons cepat terhadap kondisi kesehatan yang membutuhkan penanganan."}, {"id": 177, "question": "Petugas kesehatan haji yang bertugas memberikan pelayanan di Pos Kesehatan Arafah berasal dari...", "options": [{"text": "Petugas KKHI Madinah dan petugas sektor Madinah", "correct": false}, {"text": "Petugas KKHI Makkah dan petugas kloter", "correct": false}, {"text": "Petugas daerah kerja Madinah dan KKHI Makkah", "correct": false}, {"text": "Petugas daerah kerja Bandara dan KKHI Jeddah", "correct": true}], "answer": "D", "note": "Catatan:\nBerdasarkan pembagian tugas dalam materi, Pos Kesehatan Arafah didukung oleh petugas daerah kerja Bandara dan KKHI Jeddah."}, {"id": 178, "question": "Petugas kesehatan haji yang bertugas memberikan pelayanan di Pos Kesehatan Muzdalifah adalah...", "options": [{"text": "Petugas KKHI Madinah", "correct": false}, {"text": "Petugas daerah kerja Bandara", "correct": false}, {"text": "Petugas KKHI Jeddah", "correct": false}, {"text": "Petugas KKHI Makkah", "correct": true}], "answer": "D", "note": "Catatan:\nDalam pembagian tugas pelayanan kesehatan pada fase Armuzna, KKHI Makkah bertanggung jawab terhadap pelayanan di Muzdalifah."}, {"id": 179, "question": "Satgas Promotif dan Preventif (Satgas PP) dalam penyelenggaraan kesehatan haji terdiri atas...", "options": [{"text": "Dokter, tenaga kefarmasian, tenaga laboratorium, dan TPK", "correct": false}, {"text": "Dokter, perawat, tenaga gizi, dan petugas kloter", "correct": false}, {"text": "Perawat, bidan, sanitarian, dan TPK", "correct": false}, {"text": "Dokter, perawat, tenaga kesehatan lainnya, dan TPK", "correct": true}], "answer": "D", "note": "Catatan:\nSatgas PP terdiri atas dokter, perawat, tenaga kesehatan lainnya, dan TPK yang melaksanakan berbagai kegiatan promotif dan preventif."}, {"id": 180, "question": "Pelayanan kesehatan kuratif dan rehabilitatif bagi jemaah haji dilaksanakan dalam bentuk...", "options": [{"text": "Promosi kesehatan dan perlindungan spesifik", "correct": false}, {"text": "Surveilans dan pengendalian faktor risiko", "correct": false}, {"text": "Pemeriksaan kesehatan dan pembinaan kebugaran", "correct": false}, {"text": "Pelayanan rawat jalan, rawat inap, dan rujukan", "correct": true}], "answer": "D", "note": "Catatan:\nPelayanan kuratif dan rehabilitatif berfokus pada penanganan kondisi kesehatan jemaah melalui rawat jalan, rawat inap, dan rujukan."}, {"id": 181, "question": "Pengelolaan obat dan perbekalan kesehatan dalam penyelenggaraan kesehatan haji di Arab Saudi dilaksanakan oleh...", "options": [{"text": "TKH dan petugas kloter", "correct": false}, {"text": "Satgas PP dan TGC", "correct": false}, {"text": "KKHI dan petugas sektor", "correct": false}, {"text": "Satgas Obat dan Perbekalan (OP) dan TPK", "correct": true}], "answer": "D", "note": "Catatan:\nPengelolaan obat dan perbekalan kesehatan dilakukan oleh Satgas OP bersama TPK sesuai pembagian tugas yang ditetapkan."}, {"id": 182, "question": "Hasil kegiatan surveilans dalam penyelenggaraan kesehatan haji dapat dimanfaatkan sebagai...", "options": [{"text": "Dasar menentukan kelompok terbang", "correct": false}, {"text": "Dasar menentukan akomodasi jemaah", "correct": false}, {"text": "Dasar menentukan jadwal ibadah jemaah", "correct": false}, {"text": "Bahan evaluasi, dasar kebijakan, dan dasar tindakan perbaikan penyelenggaraan kesehatan haji", "correct": true}], "answer": "D", "note": "Catatan:\nData surveilans menghasilkan informasi yang dapat digunakan untuk evaluasi, pengambilan kebijakan, dan perbaikan penyelenggaraan kesehatan haji."}, {"id": 183, "question": "Penetapan kelaikan terbang dilakukan oleh dokter yang memiliki kompetensi kedokteran penerbangan pada PPIH Embarkasi Bidang Kesehatan. Berikut kondisi yang dapat menjadi alasan jemaah ditetapkan tidak laik terbang adalah...", "options": [{"text": "Penyakit menular yang berpotensi menjadi wabah", "correct": false}, {"text": "Kondisi yang dapat membahayakan orang lain atau keselamatan penerbangan", "correct": false}, {"text": "Kondisi dengan saturasi oksigen yang tidak memenuhi persyaratan", "correct": false}, {"text": "Semua jawaban benar", "correct": true}], "answer": "D", "note": "Catatan:\nKondisi yang berpotensi membahayakan jemaah, orang lain, atau keselamatan penerbangan dapat menjadi pertimbangan dalam penetapan tidak laik terbang, sesuai hasil pemeriksaan dan ketentuan kedokteran penerbangan."}, {"id": 184, "question": "Berikut merupakan upaya yang dapat dilakukan untuk membantu mencegah DVT selama perjalanan udara, kecuali...", "options": [{"text": "Menggerakkan kaki secara berkala", "correct": false}, {"text": "Melakukan peregangan tungkai", "correct": false}, {"text": "Menghindari duduk dalam posisi yang sama terlalu lama", "correct": false}, {"text": "Tidur selama perjalanan tanpa melakukan pergerakan tubuh secara berkala", "correct": true}], "answer": "D", "note": "Catatan:\nDuduk atau tidak bergerak dalam waktu lama dapat meningkatkan risiko DVT. Karena itu, jemaah dianjurkan menggerakkan tungkai dan melakukan peregangan secara berkala."}, {"id": 185, "question": "Salah satu bentuk penatalaksanaan hipertensi secara nonfarmakologis adalah...", "options": [{"text": "Meningkatkan konsumsi garam", "correct": false}, {"text": "Mengurangi aktivitas fisik", "correct": false}, {"text": "Meningkatkan konsumsi makanan tinggi lemak", "correct": false}, {"text": "Menerapkan diet rendah garam", "correct": true}], "answer": "D", "note": "Catatan:\nDiet rendah garam merupakan salah satu upaya nonfarmakologis untuk membantu mengendalikan tekanan darah."}, {"id": 186, "question": "Institusi pemerintah yang dalam materi penyelenggaraan kesehatan disebut dapat melakukan kalibrasi alat kesehatan adalah...", "options": [{"text": "Dinas Kesehatan Kabupaten/Kota", "correct": false}, {"text": "Puskesmas", "correct": false}, {"text": "Rumah sakit", "correct": false}, {"text": "BPFK", "correct": true}], "answer": "D", "note": "Catatan:\nBPFK (Balai Pengamanan Fasilitas Kesehatan) memiliki fungsi terkait pengujian dan kalibrasi alat kesehatan sesuai kewenangannya."}, {"id": 187, "question": "Selama menunggu masa kepulangan, jemaah haji tetap berada di hotel untuk beristirahat dan menjaga kondisi tubuh. Salah satu imbauan yang perlu tetap diterapkan adalah...", "options": [{"text": "Mengurangi waktu tidur agar lebih banyak beraktivitas", "correct": false}, {"text": "Membatasi konsumsi makanan dan minuman", "correct": false}, {"text": "Menghindari aktivitas ringan agar tidak banyak bergerak", "correct": false}, {"text": "Menerapkan PHBS, seperti menjaga kebersihan diri dan lingkungan", "correct": true}], "answer": "D", "note": "Catatan:\nPenerapan PHBS membantu mempertahankan kondisi kesehatan jemaah, antara lain melalui kebersihan diri dan lingkungan, konsumsi makanan bergizi, dan istirahat yang cukup."}, {"id": 188, "question": "Menurut Pasal 3 UU Nomor 8 Tahun 2019, salah satu tujuan penyelenggaraan ibadah haji dan umrah adalah...", "options": [{"text": "Meningkatkan jumlah jemaah haji dan umrah setiap tahun", "correct": false}, {"text": "Menjamin seluruh jemaah memperoleh fasilitas yang sama", "correct": false}, {"text": "Menetapkan tata cara pelaksanaan ibadah haji dan umrah di Arab Saudi", "correct": false}, {"text": "Memberikan pembinaan, pelayanan, dan pelindungan kepada jemaah haji dan jemaah umrah", "correct": true}], "answer": "D", "note": "Catatan:\nTujuan penyelenggaraan ibadah haji dan umrah mencakup pembinaan, pelayanan, dan pelindungan kepada jemaah agar dapat melaksanakan ibadah sesuai ketentuan syariat."}, {"id": 189, "question": "Pemeriksaan kesehatan jemaah haji pada masa keberangkatan, yang dilakukan sebelum pelunasan Bipih, dilaksanakan oleh...", "options": [{"text": "PPIH Embarkasi Bidang Kesehatan", "correct": false}, {"text": "Tim Kesehatan Haji (TKH)", "correct": false}, {"text": "Tim Pemeriksa Kesehatan di kabupaten/kota", "correct": true}, {"text": "Petugas KKHI", "correct": false}], "answer": "C", "note": "Catatan:\nPemeriksaan kesehatan pada masa keberangkatan dilakukan oleh Tim Pemeriksa Kesehatan di kabupaten/kota sebagai bagian dari proses penetapan status istithaah kesehatan jemaah."}, {"id": 190, "question": "Sebelum berangkat ke Arab Saudi, jemaah haji menjalani pemeriksaan kesehatan pada masa embarkasi. Pemeriksaan tersebut dilaksanakan oleh...", "options": [{"text": "Tim Pemeriksa Kesehatan kabupaten/kota", "correct": false}, {"text": "Tim Pemeriksa Kesehatan PPIH Embarkasi", "correct": true}, {"text": "Tim Kesehatan Haji Indonesia", "correct": false}, {"text": "Petugas KKHI Makkah", "correct": false}], "answer": "B", "note": "Catatan:\nPemeriksaan kesehatan masa embarkasi dilaksanakan oleh PPIH Embarkasi Bidang Kesehatan untuk menilai kondisi kesehatan jemaah dan menetapkan kelaikan terbang."}, {"id": 191, "question": "Rekapitulasi hasil penetapan istithaah kesehatan jemaah haji dilaporkan kepada...", "options": [{"text": "Kepala puskesmas dan Kepala KKHI", "correct": false}, {"text": "Menteri Kesehatan dan Menteri Agama", "correct": false}, {"text": "Ketua PPIH Embarkasi dan Kepala KKHI", "correct": false}, {"text": "Kepala daerah kabupaten/kota dan kepala dinas kesehatan provinsi", "correct": true}], "answer": "D", "note": "Catatan:\nRekapitulasi hasil penetapan istithaah kesehatan dilaporkan kepada kepala daerah kabupaten/kota dan kepala dinas kesehatan provinsi sesuai mekanisme pelaporan yang digunakan."}, {"id": 192, "question": "Inkontinensia urine merupakan kondisi ketika seseorang sulit menahan buang air kecil sehingga dapat mengalami mengompol. Tindakan yang tepat untuk membantu mencegah masalah kesehatan tersebut pada jemaah lansia adalah...", "options": [{"text": "Membatasi konsumsi air agar tidak sering buang air kecil", "correct": false}, {"text": "Menahan buang air kecil selama mungkin", "correct": false}, {"text": "Mengurangi aktivitas agar tidak perlu sering ke toilet", "correct": false}, {"text": "Tidak menahan buang air kecil dan mendampingi jemaah lansia saat ke toilet", "correct": true}], "answer": "D", "note": "Catatan:\nJemaah sebaiknya tidak menahan buang air kecil. Pendampingan lansia saat menuju toilet juga membantu menjaga keselamatan dan mengurangi risiko jatuh."}, {"id": 193, "question": "Jemaah haji dianjurkan memanfaatkan waktu untuk beristirahat selama berada di bandara sebelum melakukan perjalanan kembali ke Indonesia. Kegiatan tersebut termasuk dalam manasik kesehatan haji...", "options": [{"text": "Sehat saat tiba di rumah/kampung halaman", "correct": false}, {"text": "Sehat saat tiba di debarkasi/asrama haji", "correct": false}, {"text": "Sehat saat kepulangan di bandar udara Arab Saudi", "correct": true}, {"text": "Sehat selama masa operasional haji", "correct": false}], "answer": "C", "note": "Catatan:\nBeristirahat selama berada di bandar udara Arab Saudi bertujuan membantu menjaga kondisi fisik jemaah sebelum menempuh perjalanan pulang ke Indonesia."}, {"id": 194, "question": "Jemaah haji mengisi atau membawa Kartu Kewaspadaan Kesehatan Jemaah Haji (K3JH) saat kembali ke rumah. Kegiatan tersebut termasuk dalam manasik kesehatan haji...", "options": [{"text": "Sehat saat masa tunggu", "correct": false}, {"text": "Sehat saat kepulangan di bandar udara Arab Saudi", "correct": false}, {"text": "Sehat saat operasional haji", "correct": false}, {"text": "Sehat saat tiba di debarkasi/asrama haji", "correct": true}], "answer": "D", "note": "Catatan:\nK3JH merupakan bagian dari upaya kewaspadaan dan pemantauan kesehatan setelah kepulangan jemaah dari Arab Saudi."}, {"id": 195, "question": "Untuk memantau kemungkinan penyakit yang terbawa dari Arab Saudi setelah jemaah kembali ke Indonesia, salah satu bentuk kegiatan pemantauan kesehatan adalah...", "options": [{"text": "Jemaah tidak perlu melapor apabila tidak memiliki keluhan", "correct": false}, {"text": "Jemaah harus dirawat di rumah sakit selama 14 hari", "correct": false}, {"text": "Petugas kesehatan melakukan kunjungan rumah untuk memantau kesehatan jemaah yang pulang dari tanah suci", "correct": true}, {"text": "Jemaah hanya melakukan pemeriksaan apabila mengalami penyakit berat", "correct": false}], "answer": "C", "note": "Catatan:\nKunjungan rumah oleh petugas kesehatan merupakan salah satu bentuk pemantauan kesehatan jemaah setelah kembali dari tanah suci, terutama untuk mendeteksi keluhan atau masalah kesehatan secara dini."}, {"id": 196, "question": "Selama menunggu masa kepulangan, jemaah haji diimbau untuk beristirahat di hotel dan menjaga kondisi tubuh. Imbauan khusus bagi jemaah lansia dan penderita penyakit penyerta adalah...", "options": [{"text": "Mengurangi konsumsi obat agar tidak terjadi ketergantungan", "correct": false}, {"text": "Menghindari konsultasi kesehatan selama tidak mengalami keluhan", "correct": false}, {"text": "Memperbanyak aktivitas fisik agar tubuh tetap aktif", "correct": false}, {"text": "Berkonsultasi dengan tenaga kesehatan secara rutin", "correct": true}], "answer": "D", "note": "Catatan:\nJemaah lansia dan penderita penyakit penyerta perlu berkonsultasi dengan tenaga kesehatan secara rutin untuk memantau kondisi kesehatan dan menjaga penyakit tetap terkendali menjelang kepulangan."}, {"id": 197, "question": "Dalam pelaksanaan ibadah haji dan umrah, keadaan seseorang yang telah berniat memasuki ibadah haji atau umrah dan terikat dengan larangan-larangan tertentu disebut...", "options": [{"text": "Tawaf", "correct": false}, {"text": "Ihram", "correct": true}, {"text": "Sa'i", "correct": false}, {"text": "Wukuf", "correct": false}], "answer": "B", "note": "Catatan:\nIhram (إحرام) adalah keadaan seseorang setelah berniat untuk melaksanakan haji atau umrah dan mulai terikat dengan ketentuan serta larangan ihram."}, {"id": 198, "question": "Dalam bahasa Arab, istilah wukuf (وقوف) dalam rangkaian ibadah haji merujuk pada kegiatan...", "options": [{"text": "Mengelilingi Ka'bah sebanyak tujuh putaran", "correct": false}, {"text": "Berjalan antara Safa dan Marwah", "correct": false}, {"text": "Berdiam atau berada di Arafah pada waktu yang telah ditentukan", "correct": true}, {"text": "Bermalam di Mina", "correct": false}], "answer": "C", "note": "Catatan:\nWukuf (وقوف) secara bahasa berkaitan dengan berdiri atau berada di suatu tempat. Dalam ibadah haji, wukuf dilaksanakan di Arafah pada waktu yang telah ditentukan."}, {"id": 199, "question": "Jemaah haji mengelilingi Ka'bah sebanyak tujuh kali putaran sebagai salah satu rangkaian ibadah haji. Dalam bahasa Arab, kegiatan tersebut disebut...", "options": [{"text": "Sa'i", "correct": false}, {"text": "Mabit", "correct": false}, {"text": "Wukuf", "correct": false}, {"text": "Tawaf", "correct": true}], "answer": "D", "note": "Catatan:\nTawaf (طواف) berarti mengelilingi Ka'bah. Dalam pelaksanaannya, jemaah mengelilingi Ka'bah sebanyak tujuh putaran."}, {"id": 200, "question": "Setelah melaksanakan tawaf, jemaah haji atau umrah dapat melaksanakan perjalanan bolak-balik antara Bukit Safa dan Marwah sebanyak tujuh kali. Dalam bahasa Arab, ibadah tersebut disebut...", "options": [{"text": "Sa'i", "correct": true}, {"text": "Mabit", "correct": false}, {"text": "Ihram", "correct": false}, {"text": "Wukuf", "correct": false}], "answer": "A", "note": "Catatan:\nSa'i (سعي) adalah berjalan atau berlari-lari kecil antara Safa dan Marwah sebanyak tujuh kali perjalanan, sebagai salah satu rangkaian ibadah haji dan umrah."}, {"id": 201, "question": "Pemeriksaan kesehatan masa embarkasi dilaks rrect": false}, {"text": "60 detik", "correct": true}], "answer": "D", "note": "Catatan:\nPedoman pemeriksaan kesehatan embarkasi mencantumkan pengukuran frekuensi nadi selama 60 detik."}, {"id": 205, "question": "Pemeriksaan saturasi oksigen (SpO₂) dilakukan menggunakan...", "options": [{"text": "Tensimeter", "correct": false}, {"text": "Termometer", "correct": false}, {"text": "Stetoskop", "correct": false}, {"text": "Pulse oximeter", "correct": true}], "answer": "D", "note": "Catatan:\nDalam pemeriksaan tanda vital, saturasi oksigen diperiksa menggunakan pulse oximeter."}, {"id": 206, "question": "Apabila hasil pemeriksaan saturasi oksigen jemaah menunjukkan nilai yang tidak sesuai dengan kriteria, tindakan yang tepat adalah...", "options": [{"text": "Langsung diperbolehkan melanjutkan perjalanan", "correct": false}, {"text": "Dilakukan tindak lanjut sesuai hasil pemeriksaan dan kondisi klinis jemaah", "correct": true}, {"text": "Jemaah diminta mengabaikan hasil pemeriksaan", "correct": false}, {"text": "Jemaah langsung dipulangkan tanpa pemeriksaan lanjutan", "correct": false}], "answer": "B", "note": "Catatan:\nHasil pemeriksaan tanda vital yang abnormal memerlukan observasi dan tindak lanjut medis sesuai kondisi jemaah."}, {"id": 207, "question": "Observasi visual pada pemeriksaan kesehatan embarkasi dilakukan terutama untuk menilai...", "options": [{"text": "Nomor paspor dan kelompok terbang", "correct": false}, {"text": "Status vaksinasi saja", "correct": false}, {"text": "Kondisi umum jemaah secara visual", "correct": true}, {"text": "Jenis makanan yang dikonsumsi jemaah", "correct": false}], "answer": "C", "note": "Catatan:\nObservasi visual mencakup penilaian kondisi umum, antara lain kesadaran, warna kulit, ekspresi, serta tanda-tanda klinis yang tampak."}, {"id": 208, "question": "Dalam pemeriksaan kesehatan embarkasi, dokter melakukan verifikasi terhadap data kesehatan jemaah yang terdapat dalam...", "options": [{"text": "Buku nikah", "correct": false} a tidak semua keluhan otomatis menyebabkan jemaah tidak dapat diberangkatkan."}, {"id": 212, "question": "Jemaah haji yang diduga menderita penyakit menular yang berpotensi menjadi wabah memerlukan...", "options": [{"text": "Pembiaran sampai tiba di Arab Saudi", "correct": false}, {"text": "Hanya pemberian vitamin", "correct": false}, {"text": "Penanganan dan pengawasan sesuai ketentuan pencegahan dan pengendalian penyakit menular", "correct": true}, {"text": "Langsung diberangkatkan tanpa pemeriksaan", "correct": false}], "answer": "C", "note": "Catatan:\nPedoman memberikan perhatian khusus terhadap jemaah dengan penyakit menular atau penyakit berpotensi wabah, termasuk pemeriksaan dan tindakan yang diperlukan."}, {"id": 213, "question": "Dalam mendukung penanganan penyakit menular, salah satu persyaratan sarana dan prasarana adalah tersedianya...", "options": [{"text": "Ruang administrasi tambahan", "correct": false}, {"text": "Ruang tunggu VIP", "correct": false}, {"text": "Ruang penyimpanan koper", "correct": false}, {"text": "Ruang isolasi", "correct": true}], "answer": "D", "note": "Catatan:\nPedoman mencantumkan kebutuhan kapasitas dan tata ruang, termasuk ruang isolasi individu dan/atau isolasi kelompok untuk penyakit tertentu."}, {"id": 214, "question": "Salah satu persyaratan lingkungan pada ruang pelayanan kesehatan adalah tersedianya...", "options": [{"text": "Pendingin ruangan tanpa ventilasi", "correct": false}, {"text": "Ventilasi alami yang baik atau ventilasi mekanik dengan aliran udara terkontrol", "correct": true}, {"text": "Ruangan tanpa sirkulasi udara", "correct": false}, {"text": "Ruang tertutup sepenuhnya", "correct": false}], "answer": "B", "note": "Catatan:\nPedoman mencantumkan persyaratan ventilasi untuk mendukung lingkungan pelayanan kesehatan yang aman."}, {"id": 215, "question": "Dalam pelaksanaan pemeriksaan kesehatan, petugas menggunakan alat pelindung diri sesuai kebutuhan. Salah satu contoh APD adalah...", "options": [{"text": "Kop const SESSION_SIZE = 100;
let session=[], answers=[], marked=[], current=0, timer=0, interval=null, started=false;

function shuffle(a){ return [...a].sort(()=>Math.random()-0.5); }
const FREE_BANK_SIZE = 50;
const FREE_SESSION_SIZE = 20;
const PREMIUM_SESSION_SIZE = 100;
let isPremium = localStorage.getItem('petugasHajiPremium') === 'true';

function startSession(){
  const size = isPremium ? PREMIUM_SESSION_SIZE : FREE_SESSION_SIZE;
  const sourceBank = isPremium ? BANK : BANK.slice(0, Math.min(FREE_BANK_SIZE, BANK.length));
  session = shuffle(sourceBank).slice(0, Math.min(size, sourceBank.length)).map(q=>{
    const opts=shuffle(q.options);
    return {...q, options:opts};
  });
  answers=Array(session.length).fill(null); marked=Array(session.length).fill(false); current=0; timer=0; started=true;
  clearInterval(interval); interval=setInterval(()=>{timer++; updateTimer()},1000);
  render();
}

function activatePremium(){
  const modal=document.getElementById('premiumModal');
  if(modal) modal.classList.add('show');
}
function closePremium(){
  const modal=document.getElementById('premiumModal');
  if(modal) modal.classList.remove('show');
}
function contactAdmin(){
  const message = encodeURIComponent(
    'Halo Admin Febriandi, saya sudah melakukan pembayaran Premium Latihan Soal Petugas Haji sebesar Rp30.000 melalui QRIS.\\n\\nNama: \\n\\nSaya akan mengirimkan bukti pembayaran untuk verifikasi.'
  );
  window.open('https://wa.me/6282271557557?text=' + message, '_blank');
}

function verifyPremium(){
  const input=document.getElementById('premiumCode');
  const code=(input?.value || '').trim();
  if(code === 'Matano2627'){
    isPremium=true;
    localStorage.setItem('petugasHajiPremium','true');
    closePremium();
    alert('✓ Premium berhasil diaktifkan di perangkat ini. Sekarang tersedia 100 soal per sesi dari seluruh bank soal.');
    render();
  } else {
    alert('Kode aktivasi belum valid. Setelah pembayaran QRIS diverifikasi, masukkan kode yang diberikan.');
  }
}
function updateTimer(){
  const el=document.getElementById('timer'); if(!el)return;
  const m=String(Math.floor(timer/60)).padStart(2,'0'), s=String(timer%60).padStart(2,'0'); el.textContent=m+":"+s;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
  if(!started){ document.getElementById('app').innerHTML=`
  <div class="container"><div class="card start">
    <h1>🕋 Latihan Soal Petugas Haji</h1>
    <div style="font-weight:700;color:#166534;margin-bottom:12px">Oleh: Febriandi</div>
    <p>Tersedia <b>${BANK.length} soal</b>. Versi Gratis hanya memakai <b>50 soal pertama</b> sebagai bank latihan. Versi Premium membuka seluruh bank soal.</p>
    <p>Gunakan panel nomor soal untuk <b>kembali ke soal mana pun</b>. Soal yang sudah dijawab akan berwarna <b>hijau</b>, sedangkan soal yang ditandai ragu berwarna <b>kuning</b>.</p>

    <div class="premium-box">
      <div class="premium-title">🆓 Versi Gratis</div>
      <div class="premium-list">• ${FREE_SESSION_SIZE} soal per sesi<br>• Hanya dari 50 soal bank Gratis<br>• Pengacakan soal & jawaban<br>• Navigasi soal & tanda ragu<br>• Nilai dan pembahasan</div>
      <button class="big" onclick="startSession()">Mulai ${FREE_SESSION_SIZE} Soal Gratis</button>
    </div>

    <div class="premium-box">
      <div class="premium-title">👑 Versi Premium</div>
      <div class="premium-list">• <b>${PREMIUM_SESSION_SIZE} soal per sesi</b><br>• Akses seluruh ${BANK.length} bank soal<br>• Fitur gratis + fitur premium<br>• Cocok untuk simulasi tryout<br>• Harga: <b>Rp30.000</b></div>
      <div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:10px;font-size:14px;line-height:1.6">
        <b>Pembayaran Rp30.000</b><br>
        📱 Pembayaran: <b>QRIS</b><br>
        💰 Harga Premium: <b>Rp30.000</b>
      </div>
      <div class="plan">
        <button class="btn next" style="width:100%" onclick="activatePremium()">👑 Aktifkan Premium — Rp30.000</button>
      </div>
      ${isPremium ? '<div style="margin-top:10px;color:#166534;font-weight:800">✓ Premium aktif di perangkat ini</div>' : '<div style="margin-top:10px;color:#667085;font-size:12px">Setelah pembayaran, pengguna memperoleh kode aktivasi Premium.</div>'}
    </div>
  </div></div>`; return; }
  const q=session[current], selected=answers[current];
  const answeredCount=answers.filter(x=>x!==null).length;
  document.getElementById('app').innerHTML=`
  <div class="header"><div class="header-inner">
  <div><div class="title">🕋 Latihan Soal Petugas Haji</div><div class="subtitle">Oleh: Febriandi • ${isPremium?'👑 Premium':'🆓 Gratis'}</div><div class="subtitle">Sesi ${session.length} soal • ${answeredCount} sudah dijawab</div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn" style="background:#fff;color:#14532d" onclick="goHome()">⌂ Beranda</button>
    <div class="timer" id="timer">00:00</div>
  </div>
</div></div>
  <div class="container"><div class="layout">
    <main class="card">
      <div class="question-head"><div class="qnum">SOAL ${current+1} DARI ${session.length}</div><div class="badges">${marked[current]?'<span class="badge mark">⚑ Ragu</span>':''}</div></div>
      <div class="progress"><div style="width:${answeredCount/session.length*100}%"></div></div>
      <div class="question">${esc(q.question)}</div>
      ${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.text)}</span></button>`).join('')}
      ${q.note?`<div class="note" id="note" style="display:none"><b>📝 Pembahasan</b><br>${esc(q.note)}</div>`:''}
      <div class="controls">
        <button class="btn prev" onclick="go(-1)" ${current===0?'disabled':''}>← Sebelumnya</button>
        <button class="btn markbtn" onclick="toggleMark()">⚑ ${marked[current]?'Hapus Ragu':'Tandai Ragu'}</button>
        ${current<session.length-1?`<button class="btn next" onclick="go(1)">Berikutnya →</button>`:`<button class="btn next" onclick="finish()">Selesai & Nilai</button>`}
      </div>
    </main>
    <aside class="card nav-card">
      <div class="nav-title">Navigasi Soal</div>
      <div class="legend"><span><i class="dot dgreen"></i>Sudah dijawab</span><span><i class="dot dyellow"></i>Ragu</span><span><i class="dot dgray"></i>Belum</span></div>
      <div class="grid">${session.map((_,i)=>`<button class="num ${answers[i]!==null?'answered':''} ${marked[i]?'marked':''} ${i===current?'current':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>
      <button class="btn finish" onclick="finish()">Selesaikan Sesi</button>
    </aside>
  </div></div>`;
  updateTimer();
}
function goHome(){
  clearInterval(interval);
  started=false;
  current=0;
  render();
}

function answer(i){
  answers[current]=i;
  render();
}
function go(delta){ current=Math.max(0,Math.min(session.length-1,current+delta)); render(); }
function jump(i){ current=i; render(); }
function toggleMark(){marked[current]=!marked[current];render();}
function finish(){
  // Sesi boleh diselesaikan kapan saja, meskipun belum semua soal dijawab.
  const unanswered=answers.filter(x=>x===null).length;

  clearInterval(interval);

  // Simpan waktu sebelum halaman soal diganti.
  const elapsed=timer;
  const score=answers.reduce((sum,a,i)=>{
    if(a===null) return sum;
    return sum + (session[i] && session[i].options[a] && session[i].options[a].correct ? 1 : 0);
  },0);

  const dijawab=session.length-unanswered;
  const nilai=Math.round(score/session.length*100);
  const salah=dijawab-score;
  const menit=String(Math.floor(elapsed/60)).padStart(2,'0');
  const detik=String(elapsed%60).padStart(2,'0');

  document.getElementById('app').innerHTML=`
  <div class="container"><div class="card result">
    <div style="font-size:50px">🎉</div><h1>Sesi Selesai</h1>
    <div class="score">${score}/${session.length}</div>
    <p><b>Nilai ${nilai}</b> • Benar ${score} • Salah ${salah} • Belum dijawab ${unanswered}</p>
    <p>Soal dijawab: <b>${dijawab} dari ${session.length}</b> • Waktu: ${menit}:${detik}</p>
    <div class="result-actions">
      ${isPremium ? '<button class="btn next" onclick="startSession()">Latihan 100 Soal Lagi</button>' : '<button class="btn next" onclick="goHome()">👑 Lanjut ke Premium</button>'}
      <button class="btn prev" onclick="review()">Lihat Pembahasan</button>
      <button class="btn prev" onclick="goHome()">⌂ Beranda</button>
    </div>
    <div id="review" class="review"></div>
  </div></div>`;
}
function review(){
  const box=document.getElementById('review'); if(!box)return;
  box.innerHTML=session.map((q,i)=>{
    const a=answers[i], correct=q.options.findIndex(o=>o.correct);
    const status=a===null?'<span class="wrong">Kosong</span>':q.options[a].correct?'<span class="correct">Benar</span>':'<span class="wrong">Salah</span>';
    return `<div class="review-item"><b>${i+1}. ${esc(q.question)}</b><div style="margin-top:7px">${status} • Jawaban benar: <b>${String.fromCharCode(65+correct)}. ${esc(q.options[correct].text)}</b></div>${q.note?`<div class="note"><b>📝 Pembahasan</b><br>${esc(q.note)}</div>`:''}</div>`;
  }).join('');
}
render();
</script>
